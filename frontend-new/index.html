<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoWAR - AWS Well-Architected Review</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .optional {
            color: #999;
            font-size: 12px;
            font-weight: normal;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 AutoWAR</h1>
        <p class="subtitle">AWS Well-Architected Framework Evaluation</p>
        <p class="version-info" style="font-size: 11px; color: #999; margin-top: 5px;">
            Versión 1.0.0 | 05 de Marzo de 2026, 02:00 UTC
        </p>
        
        <form id="credentialsForm">
            <div class="form-group">
                <label for="accessKeyId">Access Key ID</label>
                <input type="text" id="accessKeyId" required placeholder="AKIA...">
            </div>
            
            <div class="form-group">
                <label for="secretAccessKey">Secret Access Key</label>
                <input type="password" id="secretAccessKey" required placeholder="••••••••">
            </div>
            
            <div class="form-group">
                <label for="sessionToken">Session Token <span class="optional">(opcional)</span></label>
                <input type="password" id="sessionToken" placeholder="••••••••">
            </div>
            
            <div class="form-group">
                <label for="accountId">Account ID</label>
                <input type="text" id="accountId" required placeholder="123456789012" pattern="[0-9]{12}">
            </div>
            
            <div class="form-group">
                <label for="regions">Regiones AWS (puede seleccionar múltiples)</label>
                <input type="text" id="regions" required placeholder="us-east-1, us-west-2, eu-west-1">
                <small style="color: #666; font-size: 12px; display: block; margin-top: 5px;">
                    Ingrese una o más regiones separadas por comas. Ejemplo: us-east-1 o us-east-1,us-west-2
                </small>
            </div>
            
            <button type="submit" id="submitBtn">Validar Credenciales</button>
        </form>
        
        <div id="status" class="status"></div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
