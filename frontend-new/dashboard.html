<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoWAR - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
        }
        
        .nav-menu {
            width: 250px;
            background: #2c3e50;
            color: white;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow-y: auto;
        }
        
        .nav-header {
            padding: 20px;
            background: #1a252f;
            border-bottom: 1px solid #34495e;
        }
        
        .nav-header h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .nav-header .subtitle {
            font-size: 12px;
            opacity: 0.7;
        }
        
        .nav-items {
            padding: 10px 0;
        }
        
        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ecf0f1;
            text-decoration: none;
        }
        
        .nav-item:hover {
            background: #34495e;
        }
        
        .nav-item.active {
            background: #667eea;
        }
        
        .nav-item-icon {
            font-size: 18px;
        }
        
        .main-wrapper {
            margin-left: 250px;
            flex: 1;
            padding: 20px;
        }
        
        .loading-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        
        .spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255, 255, 255, 0.3);
            border-top: 8px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            font-size: 24px;
            margin-top: 30px;
            font-weight: 600;
        }
        
        .loading-subtext {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            margin-top: 10px;
        }
        
        .dashboard-container {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
        }
        
        .pillars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .pillar-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .pillar-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .pillar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .pillar-name {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        
        .pillar-score {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }
        
        .pillar-stats {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .severity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 5px;
        }
        
        .severity-critical {
            background: #fee;
            color: #c00;
        }
        
        .severity-high {
            background: #ffe;
            color: #f80;
        }
        
        .severity-medium {
            background: #ffc;
            color: #fa0;
        }
    </style>
</head>
<body>
    <div class="nav-menu">
        <div class="nav-header">
            <h1>🔒 AutoWAR</h1>
            <div class="subtitle">AWS Well-Architected</div>
        </div>
        <div class="nav-items">
            <a href="dashboard.html" class="nav-item active">
                <span class="nav-item-icon">📊</span>
                <span>Dashboard</span>
            </a>
            <a href="analyst.html" class="nav-item">
                <span class="nav-item-icon">🔍</span>
                <span>Vista Analista</span>
            </a>
            <a href="reports.html" class="nav-item">
                <span class="nav-item-icon">📄</span>
                <span>Reportes</span>
            </a>
            <a href="#" class="nav-item" style="opacity: 0.5; pointer-events: none;">
                <span class="nav-item-icon">⚙️</span>
                <span>Configuración</span>
            </a>
        </div>
    </div>
    
    <div class="main-wrapper">
        <div class="loading-container" id="loadingContainer">
            <div class="spinner"></div>
            <div class="loading-text">Evaluando infraestructura AWS</div>
            <div class="loading-subtext">Analizando Security Pillar...</div>
        </div>
        
        <div class="dashboard-container" id="dashboardContainer">
            <div class="header">
                <h1>🔒 AutoWAR Dashboard</h1>
                <p>AWS Well-Architected Framework Evaluation</p>
            </div>
            
            <div class="pillars-grid" id="pillarsGrid">
                <!-- Pillar cards will be inserted here -->
            </div>
        </div>
    </div>
    
    <script src="dashboard-v5.js"></script>
</body>
</html>
