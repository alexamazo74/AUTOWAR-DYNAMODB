[pytest]
pythonpath = src
testpaths = tests
# Exclude interactive test scripts that require user input
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Don't collect from root-level test files meant for manual execution
norecursedirs = .git .tox dist build *.egg
addopts = --ignore=test_iam_connection.py --ignore=test_backend.py --ignore=test_backend_api.py --ignore=test_new_features.py --ignore=test_security_evaluator.py --ignore=test_ui_integration.py --ignore=demo_security_evaluation.py --ignore=api_usage_examples.py
